id: yuzawa
name: 湯沢クリニック
name_full: 医療法人社団晃正会 湯沢クリニック
address: 〒289-1115 千葉県八街市八街ほ227-1
phone: "043-443-0989"
web_url: https://yuzawa-clinic.or.jp/
signage_url: https://yuzawa-clinic.or.jp/shisetsu-kijun/
theme: green
revision: 令和8年度（2026年）診療報酬改定
effective_date: 令和8年6月1日施行
specialties:
  - 内科・外科・小児科・リハビリテーション科
notes:
  - 当院はスマートフォンによるマイナ保険証（スマホマイナ保険証）には対応しておりません。マイナンバーカードまたは資格確認書をご持参ください。
  - 令和8年5月31日をもって「医療情報取得加算」「医療DX推進体制整備加算」は廃止。6月1日より「電子的診療情報連携体制整備加算」へ移行します。
  - 当院の算定区分は届出受理内容およびマイナ保険証利用率等の実績要件により決まります。
  - 最新の届出状況は当院ホームページ「施設基準等」をご確認ください。
items:
  - id: denshi_renkei
    title: 電子的診療情報連携体制整備加算
    body: |
      当院は、マイナンバーカード（マイナ保険証）または資格確認書によるオンライン資格確認を行い、診療情報の取得・活用により質の高い医療の提供に努めています。
      ※スマートフォンによるマイナ保険証の提示には対応しておりません。カード本体または資格確認書をご持参ください。
      令和8年6月1日より、国が定めた施設基準に適合し届出を行った保険医療機関として、下表のとおり診療報酬点数を算定します。
    subsections:
      - heading: 初診時（月1回・届出区分による）
        points:
          - label: 加算1
            value: 15点
          - label: 加算2
            value: 9点
          - label: 加算3
            value: 4点
      - heading: 再診時（月1回）
        points:
          - label: 電子的診療情報連携体制整備加算
            value: 2点
    footnote: ※マイナ保険証利用率30%以上等の実績要件を満たすことが算定の前提となります。
    patient_note: |
      2026年4月より、マイナンバーカードまたは資格確認書のご持参をお願いしております。
      初診時4〜15点、再診時月1回2点が加算される場合があります。

  - id: baseup
    title: 外来・在宅ベースアップ評価料（Ⅰ）
    body: |
      当院は、医療従事者（医師・歯科医師を除く）の賃金改善の取組を継続しており、令和8年6月1日より「外来・在宅ベースアップ評価料（Ⅰ）」の施設基準に適合し、届出を行っております（令和8年5月15日・区分変更・継続届出）。
      本評価料による収入は、すべて対象職員の賃金改善（基本給等の引上げ）に充当します。
      国が定めた算定要件に従い、下表のとおり診療報酬点数を算定します。
    points:
      - label: 初診時（継続賃上げ機関）
        value: 23点
      - label: 再診時等（継続賃上げ機関）
        value: 6点
    footnote: ※新規に賃金改善を開始する機関は、初診17点・再診時等4点となります。当院は継続届出に基づき上記を算定します。
    patient_note: |
      スタッフの賃金改善のための加算です。初診・再診のたびに診療報酬として加算され、窓口負担に反映されます（自己負担3割の方で、1点あたりおおむね10円程度）。

  - id: meisaisho
    title: 明細書発行体制等加算
    body: |
      当院では、診療報酬明細書を無償で交付しております。
      窓口でお申し出いただければお渡しします。
    patient_note: 明細書の交付は無料です。

  - id: ippanmei
    title: 一般名処方加算
    body: |
      当院では、後発医薬品の使用促進と医薬品の安定供給に向け、成分名（一般名）による処方箋を発行する場合があります。
    points:
      - label: 一般名処方加算1
        value: 10点
      - label: 一般名処方加算2
        value: 8点
    patient_note: 供給不足時にも必要なお薬を提供しやすくするための取り組みです。

  - id: kouhatsu
    title: 外来後発医薬品使用体制加算
    body: |
      当院では、後発医薬品（ジェネリック）の使用を推進しております。
    patient_note: 同等の効果が期待でき、お薬代の負担軽減につながる場合があります。

  - id: gairai_kansen
    title: 外来感染対策向上加算
    body: |
      当院は、感染防止対策部門の設置、感染対策マニュアルの整備、職員研修、発熱患者の受入れに関する方針の公表等、感染防止対策に係る取組を行っています。
      地方厚生局へ届出を行った保険医療機関として、初診料又は再診料に、患者1人につき月1回、下表のとおり算定します。
    points:
      - label: 外来感染対策向上加算
        value: 6点（月1回）
    footnote: |
      ※電子的診療情報連携体制整備加算を算定した月は、同月に本加算を算定できません。
    patient_note: |
      感染防止のための加算です。月1回6点が加算され、窓口負担に反映される場合があります（自己負担3割の方で、1点あたりおおむね10円程度）。
