id: ikebukuro
name: みんなの血管外科池袋
name_full: 医療法人社団 ALTRY みんなの血管外科池袋
address: 〒171-0022 東京都豊島区南池袋1丁目27-10 油木第1ビル4F
phone: "03-5906-7601"
web_url: https://ikebukuro.altry-med.or.jp/
signage_url: https://ikebukuro.altry-med.or.jp/shisetsu-kijun/
theme: blue
revision: 令和8年度（2026年）診療報酬改定
effective_date: 令和8年6月1日施行
specialties:
  - 血管外科（下肢静脈瘤・透析シャント等）
notes:
  - 完全予約制です。受診前にご予約ください。
  - 令和8年5月31日をもって「医療情報取得加算」「医療DX推進体制整備加算」は廃止。6月1日より「電子的診療情報連携体制整備加算」へ移行します。
  - 当院の算定区分は届出受理内容およびマイナ保険証利用率等の実績要件により決まります。
items:
  - id: denshi_renkei
    title: 電子的診療情報連携体制整備加算
    body: |
      当院は、開院時よりオンライン資格確認システムの導入に取り組み、マイナ保険証の利用等を通じて診療情報を取得・活用し、質の高い医療の提供に努めています。
      電子処方箋・電子カルテ情報共有サービス（CLINS）等の医療DXにかかる取組を進めています。
      令和8年6月1日より、国が定めた施設基準に適合し届出を行った保険医療機関として、下表のとおり診療報酬点数を算定します。
    subsections:
      - heading: 初診時（月1回・届出区分による）
        points:
          - label: 加算1
            value: 15点
          - label: 加算2
            value: 9点
          - label: 加算3
            value: 4点
      - heading: 再診時（月1回）
        points:
          - label: 電子的診療情報連携体制整備加算
            value: 2点
    footnote: ※初診料で算定した月の再診料では、同月の再診分は算定できません。
    patient_note: |
      ご来院の際は、マイナ保険証または健康保険証をご持参ください。
      初診時4〜15点、再診時月1回2点が加算されます。

  - id: baseup
    title: 外来・在宅ベースアップ評価料（Ⅰ）
    body: |
      当院は、医療従事者（医師・歯科医師を除く）の賃金改善の取組を継続しており、令和8年6月1日より「外来・在宅ベースアップ評価料（Ⅰ）」の施設基準に適合し、届出を行っております（令和8年5月15日・区分変更・継続届出）。
      本評価料による収入は、すべて対象職員の賃金改善（基本給等の引上げ）に充当します。
      国が定めた算定要件に従い、下表のとおり診療報酬点数を算定します。
    points:
      - label: 初診時（継続賃上げ機関）
        value: 23点
      - label: 再診時等（継続賃上げ機関）
        value: 6点
    footnote: ※新規に賃金改善を開始する機関は、初診17点・再診時等4点となります。当院は継続届出に基づき上記を算定します。
    patient_note: |
      スタッフの賃金改善のための加算です。初診・再診のたびに診療報酬として加算され、窓口負担に反映されます（自己負担3割の方で、1点あたりおおむね10円程度）。

  - id: meisaisho
    title: 明細書発行体制等加算
    body: |
      当院では、診療報酬明細書を無償で交付しております。
    patient_note: 明細書の交付は無料です。

  - id: ippanmei
    title: 一般名処方加算
    body: |
      当院では、必要に応じて一般名処方を行い、医薬品の安定供給に配慮しています。
    points:
      - label: 一般名処方加算1
        value: 10点
      - label: 一般名処方加算2
        value: 8点
    patient_note: お薬の有効成分名で処方する場合があります。

  - id: kouhatsu
    title: 外来後発医薬品使用体制加算
    body: |
      当院では、後発医薬品（ジェネリック）の使用を推進しております。
    patient_note: 処方がある場合、お薬代の負担軽減が期待できることがあります。

  - id: ncd
    title: 臨床データベース（NCD）への参加
    body: |
      当院は、一般社団法人 National Clinical Database（NCD）のデータベース事業に参加しています。
      手術・治療に関する情報を、氏名と結びつかないIDで登録し、医療の質向上に活用します。患者さまを特定する情報はNCDには提供しません。
    patient_note: 参加に関するご質問は受付・スタッフまでお尋ねください。
