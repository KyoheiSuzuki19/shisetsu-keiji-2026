id: ikebukuro
name: みんなの血管外科池袋
name_full: 医療法人社団 ALTRY みんなの血管外科池袋
address: 〒171-0022 東京都豊島区南池袋1丁目27-10 油木第1ビル4F
phone: "03-5906-7601"
web_url: https://ikebukuro.altry-med.or.jp/
signage_url: https://ikebukuro.altry-med.or.jp/shisetsu-kijun/
theme: blue
revision: 令和8年度（2026年）診療報酬改定
effective_date: 令和8年6月1日施行
specialties:
  - 血管外科（下肢静脈瘤・透析シャント等）
notes:
  - 完全予約制です。受診前にご予約ください。
  - 令和8年5月31日をもって「医療情報取得加算」「医療DX推進体制整備加算」は廃止。6月1日より「電子的診療情報連携体制整備加算」へ移行します。
  - 当院の算定区分は届出受理内容およびマイナ保険証利用率等の実績要件により決まります。
items:
  - id: denshi_renkei
    title: 電子的診療情報連携体制整備加算
    body: |
      当院は、開院時よりオンライン資格確認システムの導入に取り組み、マイナ保険証の利用等を通じて診療情報を取得・活用し、質の高い医療の提供に努めています。
      電子処方箋・電子カルテ情報共有サービス（CLINS）等の医療DXにかかる取組を進めています。
      令和8年6月1日より、国が定めた施設基準に適合し届出を行った保険医療機関として、下表のとおり診療報酬点数を算定します。
    subsections:
      - heading: 初診時（月1回・届出区分による）
        points:
          - label: 加算1
            value: 15点
          - label: 加算2
            value: 9点
          - label: 加算3
            value: 4点
      - heading: 再診時（月1回）
        points:
          - label: 電子的診療情報連携体制整備加算
            value: 2点
    footnote: ※初診料で算定した月の再診料では、同月の再診分は算定できません。
    patient_note: |
      ご来院の際は、マイナ保険証または健康保険証をご持参ください。
      初診時4〜15点、再診時月1回2点が加算されます。

  - id: baseup
    title: 外来・在宅ベースアップ評価料（Ⅰ）
    body: |
      当院は、医療従事者（医師・歯科医師を除く）の賃金改善の取組を継続しており、令和8年6月1日より「外来・在宅ベースアップ評価料（Ⅰ）」の施設基準に適合し、届出を行っております（令和8年5月15日・区分変更・継続届出）。
      本評価料による収入は、すべて対象職員の賃金改善（基本給等の引上げ）に充当します。
      国が定めた算定要件に従い、下表のとおり診療報酬点数を算定します。
    points:
      - label: 初診時（継続賃上げ機関）
        value: 23点
      - label: 再診時等（継続賃上げ機関）
        value: 6点
    footnote: ※新規に賃金改善を開始する機関は、初診17点・再診時等4点となります。当院は継続届出に基づき上記を算定します。
    patient_note: |
      スタッフの賃金改善のための加算です。初診・再診のたびに診療報酬として加算され、窓口負担に反映されます（自己負担3割の方で、1点あたりおおむね10円程度）。

  - id: meisaisho
    title: 明細書発行体制等加算
    body: |
      当院では、診療報酬明細書を無償で交付しております。
    patient_note: 明細書の交付は無料です。

  - id: ippanmei
    title: 一般名処方加算
    body: |
      当院では、必要に応じて一般名処方を行い、医薬品の安定供給に配慮しています。
      令和8年6月1日より、バイオ後続品のあるバイオ医薬品の一般名処方も算定対象に含まれます。
    points:
      - label: 一般名処方加算1（2品目以上が一般名処方の場合）
        value: 8点（処方箋1回につき）
      - label: 一般名処方加算2（1品目でも一般名処方の場合）
        value: 6点（処方箋1回につき）
    footnote: ※令和8年4月1日の診療報酬改定により、加算1は10点→8点、加算2は8点→6点に変更されています。
    patient_note: お薬の有効成分名で処方する場合があります。

  - id: jikangai1
    title: 時間外対応体制加算（1）
    body: |
      当院は、標榜時間外の時間帯において、継続的に受診している患者からの電話等による問い合わせに、原則として常勤の医師・看護職員等が常時対応できる体制を整備しています。
      やむを得ず応答できなかった場合でも、速やかに患者さまへ折り返し連絡できる体制を整え、緊急時の連絡先・対応体制を院内掲示・診察券等で周知しています。
      地方厚生局へ「時間外対応体制加算1」の届出を行った保険医療機関として、再診料に下表のとおり算定します（初診料には算定できません）。
    points:
      - label: 時間外対応体制加算1
        value: 7点（再診時）
    footnote: |
      ※令和8年6月1日より「時間外対応加算」から名称・点数が改定されています（加算1は5点→7点）。
      ※電話等による再診の場合においても算定できます。再診料を算定する都度、加算できます。
    patient_note: |
      時間外の問い合わせ対応体制に関する加算です。再診のたびに算定され、窓口負担に反映される場合があります。

  - id: tanki_taiji_shujutsu1
    title: 短期滞在手術等基本料（1）
    body: |
      当院は、日帰り手術等の短期滞在手術について、国が定める施設基準に適合し、地方厚生局へ「短期滞在手術等基本料1」の届出を行っています。
      対象となる手術・検査等について、術前・術後の管理、検査、麻酔、処置等を包括的に評価し、下表のとおり算定します（手術料・検査料等を個別に算定する場合と異なる包括評価です）。
      下肢静脈瘤手術等、当院で行う日帰り手術の多くは、主として入院以外で実施する手術（ロ）に該当します。
    subsections:
      - heading: 主として入院で実施されている手術（イ）
        points:
          - label: 麻酔を伴う手術
            value: 2,948点
          - label: 麻酔を伴わない手術
            value: 2,719点
      - heading: イ以外の手術（ロ）※当院の日帰り手術の多くはこちら
        points:
          - label: 麻酔を伴う手術
            value: 795点
          - label: 麻酔を伴わない手術
            value: 680点
    footnote: |
      ※令和8年6月1日改定により、「ロ」の点数が見直されています（麻酔あり795点・なし680点）。
      ※実際に算定する区分・点数は、手術の内容・麻酔の有無・包括の対象範囲により決まります。
      ※短期滞在手術等基本料を算定した日は、包括範囲内の検査・麻酔管理料等を別途算定できません。
    patient_note: |
      日帰り手術等では、手術に伴う一連の管理をまとめた点数で算定します。手術内容により診療費が大きく異なります。事前に説明いたします。

  - id: jomyaku_asshuku
    title: 静脈圧迫処置（慢性静脈不全に対するもの）
    body: |
      当院は、慢性静脈不全による難治性下肢潰瘍の患者さまに対し、弾性着衣・弾性包帯による圧迫、圧迫下の運動、患肢のスキンケア、セルフケア指導を組み合わせた静脈圧迫処置を行える体制を整備しています。
      血管外科を標榜する専任の常勤医師・看護師を配置し、下肢静脈超音波検査等により診断したうえで、日本静脈学会等が定める指針に沿って処置・指導を行います。
      地方厚生局へ施設基準の届出を行った保険医療機関として、下表のとおり算定します。
    points:
      - label: 静脈圧迫処置
        value: 200点（月1回・3か月を限度。初回潰瘍100cm²超は6か月を限度）
      - label: 静脈圧迫処置初回加算
        value: 150点（初回の処置時に限り1回）
    footnote: |
      ※算定には、2週間以上持続する難治性潰瘍、慢性静脈不全の診断根拠、患者さまの同意等、国が定める要件を満たす必要があります。
      ※専任の医師が直接行うか、専任の医師の指導の下で専任の看護師が行います（所定の研修修了者）。
    patient_note: |
      静脈性の足の潰瘍等に対する圧迫療法・セルフケア指導です。該当する方に限り算定され、窓口負担に反映されます。

  - id: sanso_tanka
    title: 酸素の購入価格の届出
    body: |
      当院は、診療に酸素を使用する場合、毎年2月15日までに関東信越厚生局へ「酸素の購入価格の届出」を行い、届出した単価をもとに診療報酬を請求しています（令和8年4月1日〜令和9年3月31日分を届出済み）。
      届出単価は、前年1月〜12月の当院における酸素の購入実績に基づき算出します。
      酸素吸入等の処置に係る酸素の価格は、届出単価に基づき算定します（国の上限単価の範囲内）。
      具体的な単価は診療内容・使用量により異なります。詳細は受付までお問い合わせください。
    patient_note: 酸素吸入等を行った場合、届出単価に基づき酸素料が算定され、診療費に反映されます。
