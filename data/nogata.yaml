id: nogata
name: のがたクリニック
name_full: 医療法人社団 ALTRY のがたクリニック
address: 〒165-0027 東京都中野区野方1丁目40-1
phone: "03-3389-2201"
web_url: https://nogata.altry-med.or.jp/
signage_url: https://nogata.altry-med.or.jp/shisetsu-kijun/
theme: green
revision: 令和8年度（2026年）診療報酬改定
effective_date: 令和8年6月1日施行
specialties:
  - 内科・循環器内科・消化器内科・心臓血管外科・在宅診療・外科・神経内科
notes:
  - 令和8年5月31日をもって「医療情報取得加算」「医療DX推進体制整備加算」は廃止。6月1日より「電子的診療情報連携体制整備加算」へ移行します。
  - 当院の算定区分は届出受理内容およびマイナ保険証利用率等の実績要件により決まります。
items:
  - id: denshi_renkei
    title: 電子的診療情報連携体制整備加算
    body: |
      当院は、オンライン資格確認の体制を有し、薬剤情報・特定健診情報等の診療情報を取得・活用して質の高い医療の提供に努めています。
      電子処方箋の発行、電子カルテ情報共有サービス（CLINS）の活用等、医療DXにかかる取組を実施しています。
      令和8年6月1日より、国が定めた施設基準に適合し届出を行った保険医療機関として、下表のとおり診療報酬点数を算定します。
    subsections:
      - heading: 初診時（月1回・届出区分による）
        points:
          - label: 加算1
            value: 15点
          - label: 加算2
            value: 9点
          - label: 加算3
            value: 4点
      - heading: 再診時（月1回）
        points:
          - label: 電子的診療情報連携体制整備加算
            value: 2点
    footnote: |
      ※初診料で算定した月の再診料では、同月の再診分は算定できません（旧・再診時4点から2点へ変更）。
      ※マイナ保険証利用率30%以上等の実績要件が必要です。
    patient_note: |
      マイナ保険証のご利用・診療情報提供へのご協力をお願いします。
      初診時4〜15点、再診時月1回2点が加算されます（1点あたりおおむね10円程度の窓口負担変動・3割負担の場合）。

  - id: baseup
    title: 外来・在宅ベースアップ評価料（Ⅰ）
    body: |
      当院は、医療従事者（医師・歯科医師を除く）の賃金改善の取組を継続しており、令和8年6月1日より「外来・在宅ベースアップ評価料（Ⅰ）」の施設基準に適合し、届出を行っております（令和8年5月15日・区分変更・継続届出）。
      本評価料による収入は、すべて対象職員の賃金改善（基本給等の引上げ）に充当します。
      国が定めた算定要件に従い、下表のとおり診療報酬点数を算定します。
    points:
      - label: 初診時（継続賃上げ機関）
        value: 23点
      - label: 再診時等（継続賃上げ機関）
        value: 6点
    footnote: ※新規に賃金改善を開始する機関は、初診17点・再診時等4点となります。当院は継続届出に基づき上記を算定します。
    patient_note: |
      スタッフの賃金改善のための加算です。初診・再診のたびに診療報酬として加算され、窓口負担に反映されます（自己負担3割の方で、1点あたりおおむね10円程度）。

  - id: meisaisho
    title: 明細書発行体制等加算
    body: |
      当院では、診療報酬明細書を無償で交付しております。
    patient_note: 明細書の交付は無料です。

  - id: ippanmei
    title: 一般名処方加算
    body: |
      当院では、後発医薬品の使用促進と医薬品の安定供給に向けた取り組みを実施しています。
      成分名（一般名）による処方箋を発行する場合があります。
      令和8年6月1日より、バイオ後続品のあるバイオ医薬品の一般名処方も算定対象に含まれます。
    points:
      - label: 一般名処方加算1（2品目以上が一般名処方の場合）
        value: 8点（処方箋1回につき）
      - label: 一般名処方加算2（1品目でも一般名処方の場合）
        value: 6点（処方箋1回につき）
    footnote: ※令和8年4月1日の診療報酬改定により、加算1は10点→8点、加算2は8点→6点に変更されています。
    patient_note: 供給不足時にも必要なお薬を提供しやすくするための取り組みです。

  - id: gairai_kansen
    title: 外来感染対策向上加算
    body: |
      当院は、感染防止対策部門の設置、感染対策マニュアルの整備、職員研修、発熱患者の受入れに関する方針の公表等、感染防止対策に係る取組を行っています。
      地方厚生局へ届出を行った保険医療機関として、初診料又は再診料に、患者1人につき月1回、下表のとおり算定します。
    points:
      - label: 外来感染対策向上加算
        value: 6点（月1回）
    footnote: |
      ※電子的診療情報連携体制整備加算を算定した月は、同月に本加算を算定できません。
    patient_note: |
      感染防止のための加算です。月1回6点が加算され、窓口負担に反映される場合があります（自己負担3割の方で、1点あたりおおむね10円程度）。

  - id: choki_refill
    title: 長期処方・リフィル処方箋
    body: |
      当院は患者さまの状態に応じ、28日以上の長期処方、またはリフィル処方箋の発行を行っております。
    patient_note: 通院回数の軽減につながる場合があります。詳細は医師・スタッフにお尋ねください。

  - id: shinzou_rehab
    title: 心大血管リハビリテーション施設基準Ⅰ
    body: |
      当院は、心大血管リハビリテーション施設基準Ⅰを満たす体制を有しており、心疾患等の患者さまに対する心臓リハビリテーションプログラムを提供しています。
      運動負荷試験等により適応を判断し、紹介元医療機関との連携のもとプログラムを実施します。
    patient_note: 心臓のリハビリテーションが必要な方は、受診時に医師へご相談ください。
