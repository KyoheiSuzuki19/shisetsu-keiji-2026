id: nogata
name: のがたクリニック
name_full: 医療法人社団 ALTRY のがたクリニック
address: 〒165-0027 東京都中野区野方1丁目40-1
phone: "03-3389-2201"
web_url: https://nogata.altry-med.or.jp/
signage_url: https://nogata.altry-med.or.jp/shisetsu-kijun/
theme: green
revision: 令和8年度（2026年）診療報酬改定
effective_date: 令和8年6月1日施行
specialties:
  - 内科・循環器内科・消化器内科・心臓血管外科・在宅診療・外科・神経内科・リハビリテーション科・内視鏡
notes:
  - 令和8年5月31日をもって「医療情報取得加算」「医療DX推進体制整備加算」は廃止。6月1日より「電子的診療情報連携体制整備加算」へ移行します。
  - 当院の算定区分は届出受理内容およびマイナ保険証利用率等の実績要件により決まります。
items:
  - id: hoken_iryo
    title: 保険医療機関としての掲示
    body: |
      当院は、健康保険法等に基づく保険医療機関です。
      健康保険証・マイナ保険証・資格確認書等により資格確認を行い、保険診療を行っています。
      各種公費負担医療（該当する場合）についても取り扱っております。詳細は受付までお問い合わせください。

  - id: denshi_renkei
    title: 電子的診療情報連携体制整備加算
    body: |
      当院は、オンライン資格確認の体制を有し、薬剤情報・特定健診情報等の診療情報を取得・活用して質の高い医療の提供に努めています。
      電子処方箋の発行、電子カルテ情報共有サービス（CLINS）の活用等、医療DXにかかる取組を実施しています。
      令和8年6月1日より、「電子的診療情報連携体制整備加算1」（電子処方箋・電子カルテ情報共有等の活用実績がある場合）の施設基準に適合し届出を行った保険医療機関として、下表のとおり算定します。
    subsections:
      - heading: 初診時（月1回）
        points:
          - label: 電子的診療情報連携体制整備加算1
            value: 15点
      - heading: 再診時（月1回）
        points:
          - label: 電子的診療情報連携体制整備加算
            value: 2点
    footnote: |
      ※初診料で算定した月の再診料では、同月の再診分は算定できません（旧・再診時4点から2点へ変更）。
      ※マイナ保険証利用率30%以上等の実績要件が必要です。
    patient_note: |
      マイナ保険証のご利用・診療情報提供へのご協力をお願いします。
      初診時は月1回15点、再診時は月1回2点が加算されます（1点あたりおおむね10円程度の窓口負担変動・3割負担の場合）。

  - id: baseup
    title: 外来・在宅ベースアップ評価料（Ⅰ）
    body: |
      当院は、医療従事者（医師・歯科医師を除く）の賃金改善の取組を継続しており、令和8年6月1日より「外来・在宅ベースアップ評価料（Ⅰ）」の施設基準に適合し、届出を行っております（令和8年5月15日・区分変更・継続届出）。
      本評価料による収入は、すべて対象職員の賃金改善（基本給等の引上げ）に充当します。
      国が定めた算定要件に従い、下表のとおり診療報酬点数を算定します。
    points:
      - label: 初診時（継続賃上げ機関）
        value: 23点
      - label: 再診時（継続賃上げ機関）
        value: 6点
    footnote: ※新規に賃金改善を開始する機関は、初診17点・再診時4点となります。当院は継続届出に基づき上記を算定します。
    patient_note: |
      スタッフの賃金改善のための加算です。初診・再診のたびに診療報酬として加算され、窓口負担に反映されます（自己負担3割の方で、1点あたりおおむね10円程度）。

  - id: meisaisho
    title: 明細書発行体制等加算
    body: |
      当院では、診療報酬明細書を無償で交付しております。
    patient_note: 明細書の交付は無料です。

  - id: ippanmei
    title: 一般名処方加算
    body: |
      当院では、後発医薬品の使用促進と医薬品の安定供給に向けた取り組みを実施しています。
      成分名（一般名）による処方箋を発行する場合があります。
      令和8年6月1日より、バイオ後続品のあるバイオ医薬品の一般名処方も算定対象に含まれます。
    points:
      - label: 一般名処方加算1（2品目以上が一般名処方の場合）
        value: 8点（処方箋1回につき）
      - label: 一般名処方加算2（1品目でも一般名処方の場合）
        value: 6点（処方箋1回につき）
    footnote: ※令和8年4月1日の診療報酬改定により、加算1は10点→8点、加算2は8点→6点に変更されています。
    patient_note: 供給不足時にも必要なお薬を提供しやすくするための取り組みです。

  - id: kinou_kyouka
    title: 機能強化加算
    body: |
      当院は、地域におけるかかりつけ医機能の発揮、医療の質の向上、業務継続計画（BCP）の策定等、国が定める施設基準に適合し、地方厚生局へ届出を行っています。
      地域包括診療加算等を算定する保険医療機関として、初診料に下表のとおり算定します（再診料には算定できません）。
    points:
      - label: 機能強化加算
        value: 80点（初診時）
    footnote: |
      ※令和8年度改定により、業務継続計画（BCP）の策定・見直し体制等が要件に加わりました。
      ※外来データ提出加算の届出・算定を推進する取組を行っています。

  - id: chiki_houkatsu
    title: 地域包括診療加算
    body: |
      当院は、高血圧症・糖尿病・脂質異常症・慢性心不全・慢性腎臓病・認知症等の慢性疾患を有する患者さまに対し、継続的かつ全人的な診療を行っています。
      令和8年6月1日より、認知症地域包括診療加算は地域包括診療加算に統合され、患者の状態に応じて区分して算定します。
      地方厚生局へ届出を行った保険医療機関として、対象患者の再診料に、下表のとおり算定します（初診・訪問診療・電話再診では算定できません）。
    subsections:
      - heading: 再診時（患者の状態に応じて算定）
        points:
          - label: 加算1／認知症を有する患者等
            value: 38点
          - label: 加算2／認知症を有する患者等
            value: 31点
          - label: 加算1／その他の慢性疾患等を有する患者等
            value: 28点
          - label: 加算2／その他の慢性疾患等を有する患者等
            value: 21点
    footnote: |
      ※対象疾患・同意の取得等、国が定める算定要件を満たす場合に算定します。
      ※加算1・2の区分は、当該再診時の患者の状態により決まります。

  - id: jikangai3
    title: 時間外対応体制加算（3）
    body: |
      当院は、標榜時間外の夜間において、継続的に受診している患者からの電話等による問い合わせに、原則として常勤職員等が対応できる体制を整備しています。
      休診日・深夜・休日等については、留守番電話等で地域の救急医療機関等の連絡先を案内します。
      地方厚生局へ「時間外対応体制加算3」の届出を行った保険医療機関として、再診料に4点を算定します。
    points:
      - label: 時間外対応体制加算3
        value: 4点（再診時）
    patient_note: 時間外の問い合わせ対応体制に関する加算です。再診時に算定される場合があります。

  - id: shien_shin3
    title: 在宅療養支援診療所（支援診3）
    body: |
      当院は、在宅療養支援診療所（別添1第9の1の(3)に規定する基準）として、地方厚生局へ届出を行っています。
      在宅療養を必要とする患者に対し、緊急時の往診・入院調整、24時間の連絡・往診体制、訪問看護ステーション等との連携、地域包括支援センター等との連携調整等、在宅医療に係る体制を整備しています。
      標榜診療科目に「在宅診療」を掲げ、在宅療養の提供に努めています。
    patient_note: 在宅で療養される方は、緊急時の連絡先・受入体制等について、担当医より説明を受けています。

  - id: nicotine
    title: ニコチン依存症管理料
    body: |
      当院は、敷地内禁煙、禁煙治療の経験を有する医師・専任看護師の配置、呼気一酸化炭素濃度測定器の備え等、国が定める施設基準に適合し、地方厚生局へ届出を行っています。
      禁煙を希望する患者さまに対し、スクリーニングテスト等によりニコチン依存症と診断された場合、総合的な禁煙指導・治療管理を行います。
      禁煙治療を行っている旨を院内の見やすい場所に掲示しています。
    subsections:
      - heading: ニコチン依存症管理料1（5回まで）
        points:
          - label: 初回
            value: 230点
          - label: 2回目〜4回目（対面）
            value: 184点
          - label: 5回目
            value: 180点
      - heading: ニコチン依存症管理料2
        points:
          - label: 一連につき（初回時1回）
            value: 800点
    footnote: ※平均継続回数等の実績により、所定点数の70％で算定する場合があります。
    patient_note: 禁煙外来・禁煙指導を行っています。

  - id: gan_shidou
    title: がん患者指導管理料
    body: |
      当院は、悪性腫瘍と診断された患者さまに対し、診療方針の説明・心理面への配慮・抗がん剤治療の説明・遺伝子検査等の説明など、状況に応じた指導管理を行える体制を整備し、地方厚生局へ届出を行っています。
      患者さまの治療内容・状態に応じ、下表の区分のうち該当するものを算定します。
    subsections:
      - heading: 算定区分（内容の目安）
        points:
          - label: イ／診療方針・意思決定支援
            value: 500点
          - label: ロ／心理面接
            value: 200点
          - label: ハ／抗悪性腫瘍剤等の説明
            value: 200点
          - label: ニ／遺伝子検査等の説明
            value: 300点（患者1人につき1回）
    footnote: |
      ※イ・ロ・ハは通算6回まで。イ算定日にロ・ハは算定できません。
      ※情報通信機器を用いた場合は、イ435点・ロ174点・ハ174点・ニ261点となります。
    patient_note: がん診療に関する説明・相談・指導を行っています。

  - id: program
    title: プログラム医療機器等指導管理料
    body: |
      当院は、ニコチン依存症治療補助アプリ等のプログラム医療機器（特定保険医療材料）の使用に係る指導管理を行える体制を整備し、地方厚生局へ届出を行っています。
      ニコチン依存症管理料等の医学管理と併せ、プログラム医療機器の使用方法・療養上の注意等について指導した場合、下表のとおり算定します。
    points:
      - label: プログラム医療機器等指導管理料
        value: 90点（月1回）
      - label: 導入期加算
        value: 50点（初回指導管理月のみ）
    footnote: ※ニコチン依存症管理料等、対象となる医学管理料の算定が前提です。
    patient_note: 禁煙治療でアプリ等を使用する場合、指導管理料が算定されることがあります。

  - id: zaitaku_sougou
    title: 在宅時医学総合管理料
    body: |
      当院は在宅療養支援診療所として、通院が困難な在宅療養患者（施設入居者等を除く）に対し、患者さまの同意を得て、計画的な医学管理の下で定期的な訪問診療を行っています。
      地方厚生局へ「在宅時医学総合管理料」の施設基準に係る届出を行い、訪問回数・単一建物内の管理患者数等に応じて、月1回、下表のとおり算定します。
      令和8年6月1日改定により、併せて算定する「在宅緩和ケア充実診療所・病院加算」は「在宅医療充実体制加算」に名称変更され、点数が引き上げられています。
    subsections:
      - heading: 月2回以上訪問の例（在宅療養支援診療所・無床）
        points:
          - label: 単一建物診療患者1人
            value: 4,085点
          - label: 単一建物診療患者2〜9人
            value: 2,185点
          - label: 単一建物診療患者10〜19人
            value: 1,085点
          - label: 単一建物診療患者20〜49人
            value: 970点
          - label: 上記以外
            value: 825点
    footnote: |
      ※上記は月2回以上訪問・重症患者割合等の施設基準を満たす場合の代表例です。月1回訪問の場合は点数が異なります。
      ※実際の点数は、患者の重症度、情報通信機器を用いた診療の有無等によりも変わります。
      ※訪問診療料・往診料等は別途算定します。
    patient_note: 在宅で療養中の方への訪問診療・医学管理に関する評価料です。

  - id: sanso_tanka
    title: 酸素の購入価格の届出
    body: |
      当院は、診療に酸素を使用する場合、毎年2月15日までに関東信越厚生局へ「酸素の購入価格の届出」を行い、届出した単価をもとに診療報酬を請求しています（令和8年4月1日〜令和9年3月31日分を届出済み）。
      届出単価は、前年1月〜12月の当院における酸素の購入実績に基づき算出します。
      酸素吸入等の処置に係る酸素の価格は、届出単価に基づき算定します（国の上限単価の範囲内）。
      具体的な単価は診療内容・使用量により異なります。詳細は受付までお問い合わせください。
    patient_note: 在宅酸素療法・酸素吸入等を行った場合、届出単価に基づき酸素料が算定されます。

  - id: gairai_kansen
    title: 外来感染対策向上加算
    body: |
      当院は、感染防止対策部門の設置、感染対策マニュアルの整備、職員研修、発熱患者の受入れに関する方針の公表等、感染防止対策に係る取組を行っています。
      地方厚生局へ届出を行った保険医療機関として、初診料又は再診料に、患者1人につき月1回、下表のとおり算定します。
    points:
      - label: 外来感染対策向上加算
        value: 6点（月1回）
    footnote: |
      ※電子的診療情報連携体制整備加算を算定した月は、同月に本加算を算定できません。
    patient_note: |
      感染防止のための加算です。月1回6点が加算され、窓口負担に反映される場合があります（自己負担3割の方で、1点あたりおおむね10円程度）。

  - id: choki_refill
    title: 長期処方・リフィル処方箋
    body: |
      当院は患者さまの状態に応じ、28日以上の長期処方、またはリフィル処方箋の発行を行っております。
    patient_note: 通院回数の軽減につながる場合があります。詳細は医師・スタッフにお尋ねください。

  - id: shinzou_rehab
    title: 心大血管リハビリテーション施設基準Ⅰ
    body: |
      当院は、心大血管リハビリテーション施設基準Ⅰを満たす体制を有しており、心疾患等の患者さまに対する心臓リハビリテーションプログラムを提供しています。
      運動負荷試験等により適応を判断し、紹介元医療機関との連携のもとプログラムを実施します。
    patient_note: 心臓のリハビリテーションが必要な方は、受診時に医師へご相談ください。
